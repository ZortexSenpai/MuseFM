name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet test -c Release

  docker:
    name: Build image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the version comes from the tags and the commits since

      - name: Work out the version
        id: version
        run: .github/scripts/next-version.sh

      - uses: docker/setup-buildx-action@v4

      - name: Build (not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          build-args: |
            VERSION=${{ steps.version.outputs.version }}-pr.${{ github.event.pull_request.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUMP: ${{ steps.version.outputs.bump }}
          RELEASE: ${{ steps.version.outputs.release }}
        run: |
          if [[ "$RELEASE" == true ]]; then
            echo "Merging this publishes **$VERSION** ($BUMP)." >>"$GITHUB_STEP_SUMMARY"
          else
            echo "Merging this publishes nothing: no \`feat\`, \`fix\`, \`perf\` or breaking commit since v$VERSION." >>"$GITHUB_STEP_SUMMARY"
          fi
